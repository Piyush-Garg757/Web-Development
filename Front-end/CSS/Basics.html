<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <!-- teen tarah se css file ko daal sakte hain apmi html file ke sang 
    inline external aur internal -->
    <p style="color :blueviolet ; font-size: 55px; border:20px solid black">Hello world</p>
    <!-- ye hai inline matlab usi line mein daalte jayenge jo jo chaihye aur uske liye keyword style dhyaan rakhna hai-->
    <!-- yahi hum style tag head mein de dein pure programme ke liye to vo hota hai internal CSS -->
    <!-- abbhi humne inline de rakha hai isiliye vo use priority de raha hai -->
    <!-- in above example color is a key and bluevioket is a value and use a semicolon to separate two keys  -->
    <!-- internal css ke liiye hum classes aur ids ccreate karte hain jin cheezon ki same formatting rakhhni hai unhein same class de do  -->
    <!-- priority inline>internal>external -->
    <!-- haan but ji external file hum add kar rhe hain use internal styles ke baad link karein to kuch cases mein humara extrernal prior ho sakta hai -->
    <!-- universal selector jise * se show karte hain vo sabpe apply hota hai basically kuch basic cheezein web page humein already deta hai unhein change karne k eliye hum universal slectro use kar sakte hain -->
    <!-- element selector matlab jaise normaly karte hain h1 ke liiye ya p ke liye formatting likh di -->
    <!-- class selector apna normmal vala -->
    <!-- hum multiple classes ko bhi ek tag ke andar likh sakte hain -->
    <!-- descendant selector matlab jaise main ke andar p tag banaya to uss p ke liye styles dena -->
    <!-- static erbsite vo jo har kisi ke liye same rahe dynamic vo jo user specific ho -->
</body>
</html>
