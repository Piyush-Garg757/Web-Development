<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Scheme Switcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1 class="heading">Color Scheme Switcher</h1>
    </header>
    <main class="main">
        <section class="boxes">
            <div class="box box1" id="grey"></div>
            <div class="box box2" id="white"></div>
            <div class="box box3" id="blue"></div>
            <div class="box box4" id="yellow"></div>
        </section>
        <section>
            <p>Try clicking on one of the colours above to change the background color of the page!</p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
