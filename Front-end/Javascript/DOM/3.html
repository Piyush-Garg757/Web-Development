<body style="background-color: #212121; color: #fff;">
    <div class="parent">
        <!-- this is a comment -->
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
    </div>
</body>
<script>
    const parent = document.querySelector('.parent')
    console.log(parent);
    console.log(parent.children); // isse humko ek HTMLCollection milega as output days ka 
    console.log(parent.children[1].innerHTML);
    console.log("\n");
    for (let i = 0; i < parent.children.length; i++) {
        console.log(parent.children[i]);
        console.log(parent.children[i].innerHTML);
    }
    console.log(parent.firstElementChild);
    console.log(parent.lastElementChild);

    console.log("*****************************************************");
    

    const day_one = document.querySelector('.day')
    console.log(day_one.innerHTML);
    console.log(day_one.parentElement.innerHTML);
    console.log(day_one.nextElementSibling.innerHTML);

    console.log(parent.childNodes); //ismein sab aa gaya jaise main div ki class di baki 4 ki class di to 5 ho gaya aur 4 div ke text to total 9 elelemts ayenge nodelist mein

    // abb jab humne ek comment bhi add kar diya to 11 ho gaye kyuki 2 add hue ek comment aur ek comment ka text
