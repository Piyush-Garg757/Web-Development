<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="background-color: #212121; color: #fff;">
    <ul class="languages">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function add_language(lang_name) {
        const li = document.createElement('li')
        li.innerHTML = `${lang_name}`
        document.querySelector('.languages').appendChild(li)
    }
    add_language("python")
    add_language("C++")

    // ye method karta kya hai ki vo har ek elment ko traverse karta hua end mein jata hai fir append karta hai to big level projects ke liye ye approach thoda  optimise kiya jata hai

    function add_language_optimised(lang_name) {
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(lang_name))
        document.querySelector('.languages').appendChild(li)
    }
    add_language_optimised("Java")

    // Editing
    const second_lang = document.querySelector('li:nth-child(2)')
    console.log(second_lang);
    // second_lang.innerHTML="Typescript"
    const new_li=document.createElement('li')
    new_li.textContent="Typescript"
    second_lang.replaceWith(new_li)
    // #  exploring multiple ways

    const  first_lang=document.querySelector('li:nth-child(1)')
    first_lang.outerHTML='<li>Golang</li>'

    // remove
    const last_lang=document.querySelector('li:last-child')
    last_lang.remove()
</script>

</html>
