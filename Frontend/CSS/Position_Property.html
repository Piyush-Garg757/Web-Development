<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        .box {
            height: 100px;
            width: 90%;
            border: 2px solid black;
            padding: 3px;
            margin: 3px;
        }

        /* kisi box ki position statcic kar denge to uspe top bottom left right dene ka koi farak nahi padega vo static ho jayega aur vahi ka vahi rahega */
        .box1 {
            background-color: #e65a5a;
            /* position: absolute;
            top: 0px; */
            /* Maine isko position absolute di aur top 50 diya to ye apne top isko isk superior position element ke respect mein milega     ab kyuki .parent mein position di hi nahi to vo position element nahi hai  to ye aur superior pe jayega aur aie hi karte karte web page ke respect mein top le lega end mein       vahi agar main .parent mein position de du to ye uske respect mein lega top */
        }

        .box2 {
            background-color: #68eb84;
            /* position: relative;
            top: 50px;
            left: 30px; */
            /* position relative karne ke baad ismein top bottom kuch bhi doge to yahi box aage peeche move hog accordingly baki boxes ke relative  unpe koi farak nahi padega */
            /* ab abhi humara box dusre boxes ke upar aa raha hai upar neeche kare pe      to agar hum chahte hin ki vo unke neeche aaye to humein z indx dena hoga jo ki bas position relative pe hi lagaya ja sakta hai ise 1 ya -1 do respectively upar neeche rakhna hai to*/
            z-index: 1;
        }

        .box3 {
            background-color: #4c678f;
            position: fixed;
            top: 120px;
            /* Position fixed deke top aut bottom dene ke baad ye elemet fixed rahega web page scroll karo to bhi wahi ka wahi rahega */
        }

        .box4 {
            background-color: #f54286;
        }
        .parent{
            height: 500px;
            width: 95%;
            padding: 30px;
            margin: 30px;
            border: 2px solid rgb(79, 83, 25);
            /* position: absolute; */
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
