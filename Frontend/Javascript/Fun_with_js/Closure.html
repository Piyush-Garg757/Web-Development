<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="background-color: #313131;">
    <button id="orange">Orange</button>
    <button id="green">Green</button>
</body>
<script>
    function outer() {
        let username = "Piyush"
        function inner() {
            console.log(username);
        }
        function inner2() {
            console.log(username);
        }
        inner()
        inner2()
    }
    outer()
    // function ke andar jitne bhi function honge unhein uss function ke variables ka access milega jaisse is case mein username ka mil raha hai        isi koo lexical scoping khte hain

    function make_function() {
        const u1 = "Piyush Garg"
        function display_name() {
            console.log(u1);
        }
        return display_name
    }
    const func = make_function()
    func()
    // ismein return kiya hai inner function ko call karne ke bajay to function to khatam ho jayega return karke aur humne to bas inner function ka reference return kiya hai to vo outer function ka u1 kaise print karayega 
    // yahan ata hai closure jo ki ye kehta hai ki iss case mein bas inner function ka scope nahi balki uska lexical scope jayega  to isiliye ye chalega
</script>
